<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Sportify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
     <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #121212; height: 100vh;">
    <div class="container">
        <div class="mainimg" style="justify-content: center; display: flex; align-items: center; margin-top: 100px;">
            <img src="./ttt.jpg" alt="" style="background-color: #121212; width: 45px;">
        </div>
        <div class="signup" style="color: white; justify-content: center; display: flex; margin-top: 30px;">
            <h1 style="font-weight: 800; font-size: 50px;"><span style="margin-left: 30px;">Sign up to</span> <br>start listening</h1>
        </div>
        <div class="form">
            <form action="" style="color: white; margin-left: 400px; margin-top: 20px;"> 
                <label for="" style="margin-bottom: 15px;">Email Address</label>
                <br><input type="email" name="" id="" style="background-color:transparent;width:400px; height: 40px; border: 1px solid white;" placeholder="name@domain.com" required height="25px">
            </form>
        </div>
        <div class="next" style="background-color: #1ED760; width: 350px; height: 50px; margin-top: 20px; margin-left: 400px; font-weight: 750; padding: 7.5px 150px; border-radius: 25px; margin-bottom: 20px;">
            <p>next</p>
        </div>
        <div class="or" style="color: white; margin-left: 550px;">
            <p>or</p>
        </div>
        <div class="buttons" style="margin-top: 20px;">
            <button style="background-color: transparent; border-radius: 25px; border: 1px solid white; height: 45px; width: 350px; margin-left: 410px; padding-left: 10px; padding-bottom: 2px; color: white; margin-bottom: 20px;">Signup with phone number</button>
            <button style="background-color: transparent; border-radius: 25px; border: 1px solid white; height: 45px; width: 350px; margin-left: 410px; padding-left: 10px; padding-bottom: 2px; color: white; margin-bottom: 20px;">Signup with google</button>
            <button style="background-color: transparent; border-radius: 25px; border: 1px solid white; height: 45px; width: 350px; margin-left: 410px; padding-left: 10px; padding-bottom: 2px; color: white;">Signup with apple</button>
        </div>
        <div class="alredy" style="display: grid; align-items: center; justify-content: center;">
            <p style="margin-top: 40px; margin-bottom: 25px; color:rgba(128, 128, 128, 0.548);">Alredy have an account?</p>
            <a href="./signin.html" style="color: white; margin-left: 57px; font-weight: 600; ">Log in</a>
        </div>
    </div>
</body>
</html>
